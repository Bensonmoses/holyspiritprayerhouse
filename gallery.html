<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics (GA4) — visitor & click counts -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0PS586KHL7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0PS586KHL7');
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Holy Spirit Prayer House (IPC)</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .gallery-hero {
      background: linear-gradient(135deg, #0D0D0D 0%, #1A0800 60%, #0D0D0D 100%);
      padding: 4rem 0 3rem; text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .gallery-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: rgba(201,168,76,0.7); font-size: 0.8rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .gallery-back:hover { color: var(--gold); }
    .gallery-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem); color: #fff;
      font-style: italic; margin-bottom: 0.5rem;
    }
    .gallery-hero p { color: rgba(255,255,255,0.55); font-size: 0.9rem; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem; padding: 3rem 0;
    }
    .photo-card {
      border-radius: var(--radius-md); overflow: hidden;
      box-shadow: var(--shadow-sm);
      background: var(--off-white);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      aspect-ratio: 4/3;
    }
    .photo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .empty-state {
      text-align: center; padding: 5rem 2rem;
      color: var(--text-light);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h3 { font-family: 'Playfair Display', serif; margin-bottom: 0.5rem; color: var(--text-mid); }

    /* Lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 9999;
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 85vh;
      object-fit: contain; border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .lightbox-close {
      position: absolute; top: 1.2rem; right: 1.5rem;
      color: #fff; font-size: 2rem; cursor: pointer;
      background: none; border: none; line-height: 1;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.7); font-size: 2.5rem;
      background: none; border: none; cursor: pointer;
      padding: 1rem; transition: color 0.2s;
    }
    .lightbox-nav:hover { color: #fff; }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-counter {
      color: rgba(255,255,255,0.5); font-size: 0.8rem;
      margin-top: 0.75rem; letter-spacing: 0.1em;
    }
  </style>
</head>
<body class="english">
<div id="site-header"></div>

<section class="gallery-hero">
  <div class="container">
    <a href="javascript:history.back()" class="gallery-back">← Back</a>
    <div id="gallery-badge" class="section-eyebrow" style="margin-bottom:0.75rem;display:block;">Gallery</div>
    <h1 id="gallery-title">Loading...</h1>
    <p id="gallery-desc"></p>
  </div>
</section>

<section style="padding:0 0 4rem;">
  <div class="container">
    <div id="photo-grid" class="photo-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="icon">📷</div>
      <h3>Photos Coming Soon</h3>
      <p>Photos for this album will appear here once they are uploaded.</p>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
  <button class="lightbox-close" id="lb-close" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev" aria-label="Previous">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lb-next" aria-label="Next">&#8250;</button>
  <div class="lightbox-counter" id="lb-counter"></div>
</div>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const albumKey = params.get('album') || '';

  // Load manifest
  let manifest;
  try {
    const r = await fetch('images/manifest.json');
    manifest = await r.json();
  } catch { manifest = { albums: {} }; }

  const album = manifest.albums[albumKey] || {};
  const title = album.title || albumKey || 'Gallery';
  const titleTelugu = album.titleTelugu || title;
  const desc = album.description || '';
  const photos = album.photos || [];

  document.title = `${title} | Holy Spirit Prayer House (IPC)`;
  document.getElementById('gallery-title').innerHTML =
    `<span class="english-text">${title}</span><span class="telugu-text">${titleTelugu}</span>`;
  document.getElementById('gallery-desc').textContent = desc;

  const grid = document.getElementById('photo-grid');
  const empty = document.getElementById('empty-state');

  if (!photos.length) {
    empty.style.display = 'block';
    return;
  }

  let current = 0;
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');

  function openLightbox(i) {
    current = i;
    lbImg.src = photos[i].path;
    lbImg.alt = photos[i].caption || '';
    lbCounter.textContent = `${i + 1} / ${photos.length}`;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lb-close').onclick = closeLightbox;
  document.getElementById('lb-prev').onclick = () => openLightbox((current - 1 + photos.length) % photos.length);
  document.getElementById('lb-next').onclick = () => openLightbox((current + 1) % photos.length);
  lb.onclick = e => { if (e.target === lb) closeLightbox(); };
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') openLightbox((current - 1 + photos.length) % photos.length);
    if (e.key === 'ArrowRight') openLightbox((current + 1) % photos.length);
    if (e.key === 'Escape') closeLightbox();
  });

  photos.forEach((photo, i) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `<img src="${photo.path}" alt="${photo.caption || ''}" loading="lazy">`;
    card.onclick = () => openLightbox(i);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
